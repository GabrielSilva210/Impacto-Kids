<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impacto Kids - Doação</title>
  <link rel="stylesheet" href="css/donate.css">
</head>
<body>

  <header class="header">
    <div class="logo"><a href="index.html">Impacto kids</a></div>
  </header>

  <main class="donate-container">

    <div class="donate-intro">
      <h1>Mude a vida de uma criança<br>Doe agora!</h1>
      <img src="assets/donation-characters.png" alt="Três personagens ilustrados representando voluntários do Impacto Kids">
    </div>

    <div class="donate-card">
      <h2>Sua doação ajuda a transformar<br>o futuro de uma criança hoje!</h2>
      <h3>Doação mensal</h3>
      
      <div class="donor-type-toggle">
        <button type="button" class="active" id="individualBtn">COMO INDIVÍDUO</button>
        <button type="button" id="companyBtn">COMO EMPRESA</button>
      </div>

      <div class="amount-options">
        <button type="button" class="amount-btn active" data-value="30">R$ 30,00</button>
        <button type="button" class="amount-btn" data-value="60">R$ 60,00</button>
        <button type="button" class="amount-btn" data-value="250">R$ 250,00</button>
      </div>
      <div class="custom-amount"><a href="#">outro valor</a></div>

      <div class="donation-benefit">
        <span class="heart-icon">🤍</span>
        <p>por mês, você ajuda a Fundação Abring a garantir alimentação de
          qualidade para crianças em situação de vulnerabilidade.</p>
      </div>

      <form class="donate-fields">
        <div class="form-row">
          <div class="field">
            <label for="name">Nome completo*</label>
            <input type="text" id="name" required>
          </div>
          <div class="field">
            <label for="cpf">CPF*</label>
            <input type="text" id="cpf" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="email">E-mail*</label>
            <input type="email" id="email" required>
          </div>
          <div class="field">
            <label for="phone">Celular*</label>
            <input type="tel" id="phone" required>
          </div>
        </div>

        <div class="payment-method">
          <button type="button" class="payment-btn active" data-method="credit">Cartão de crédito</button>
          <button type="button" class="payment-btn" data-method="debit">Cartão de débito</button>
          <button type="button" class="payment-btn" data-method="pix">Pix</button>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="card-number">Número do cartão*</label>
            <input type="text" id="card-number" required>
          </div>
          <div class="field">
            <label for="cvv">Código de segurança*</label>
            <input type="text" id="cvv" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="exp-month">Validade*</label>
            <select id="exp-month">
              <option>Mês</option>
              <option>01</option><option>02</option><option>03</option>
              <option>04</option><option>05</option><option>06</option>
              <option>07</option><option>08</option><option>09</option>
              <option>10</option><option>11</option><option>12</option>
            </select>
          </div>
          <div class="field">
            <label for="exp-year">&nbsp;</label>
            <select id="exp-year">
              <option>Ano</option>
              <option>2026</option><option>2027</option><option>2028</option>
              <option>2029</option><option>2030</option>
            </select>
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" id="terms">
          <label for="terms">Li e aceito os termos de uso</label>
        </div>

        <button type="submit" class="btn-donate">
        <a href="https://doe.aldeiasinfantis.org.br/amigoSOS/people/new?utm_source=site&utm_medium=menu&utm_campaign=aqc_dig&utm_content=doe-agora&utm_term=" class="btn-link" target="_blank">Doar</a>  
        </button>
      </form>
    </div>

  </main>

  <script>
    document.getElementById('individualBtn').addEventListener('click', function () {
      this.classList.add('active');
      document.getElementById('companyBtn').classList.remove('active');
    });
    document.getElementById('companyBtn').addEventListener('click', function () {
      this.classList.add('active');
      document.getElementById('individualBtn').classList.remove('active');
    });

    document.querySelectorAll('.amount-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });

    document.querySelectorAll('.payment-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
